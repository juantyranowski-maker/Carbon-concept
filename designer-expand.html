<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WLC Catalogue – designer view, expandable (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FBF9F8; --surface: #FFFFFF; --ink: #3E3A39; --muted: #8A8285; --hair: #E6E0E2; --panel: #F4F0F1;
  --accent: #861C3C; --accent-soft: #F6E8EC;
  --emb: #D7262B; --op: #4E5070;
  --ui: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', system-ui, sans-serif;
  --num: 'Barlow Condensed', 'Zen Kaku Gothic New', 'Arial Narrow', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--ui); }
button { font: inherit; color: inherit; cursor: pointer; }
.mock-flag { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 90; font-size: 11.5px; background: var(--ink); color: #fff; padding: 4px 12px; border-radius: 999px; opacity: .85; pointer-events: none; }

/* ---------- top bar ---------- */
.top { height: 60px; display: flex; align-items: center; gap: 16px; padding: 0 22px; border-bottom: 1px solid var(--hair); background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; font: 700 19px var(--num); letter-spacing: .12em; }
.brand i { width: 26px; height: 26px; border-radius: 50%; background: conic-gradient(var(--emb) 0 49%, var(--op) 49% 100%); display: inline-block; box-shadow: inset 0 0 0 7px var(--surface); }
.crumb { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; }
.crumb button { border: 0; background: none; padding: 4px 8px; border-radius: 8px; color: var(--muted); }
.crumb button:hover { background: var(--panel); color: var(--ink); }
.crumb b { color: var(--ink); font-weight: 700; }
.crumb .meta { font-size: 12px; }
.sp { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--hair); background: var(--panel); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(60, 30, 40, .12); }
.seg.dark button.on { background: var(--ink); color: #fff; }
.seg-label { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-right: -8px; }
.btn { border: 1px solid var(--hair); background: var(--surface); border-radius: 999px; padding: 7px 16px; font-weight: 700; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { background: none; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 12px; }

/* ---------- project picker ---------- */
.picker { max-width: 1240px; margin: 0 auto; padding: 34px 28px 60px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin: 0 0 6px; }
.picker h1 { font-size: 34px; margin: 0 0 6px; font-weight: 700; }
.lede { color: var(--muted); margin: 0 0 22px; max-width: 70ch; }
.pk-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; }
.search { border: 1px solid var(--hair); background: var(--surface); border-radius: 999px; padding: 9px 16px; width: 320px; font: inherit; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
.pcard { background: var(--surface); border: 1px solid var(--hair); border-radius: 16px; padding: 18px; box-shadow: 0 2px 14px rgba(60, 30, 40, .05); cursor: pointer; display: flex; flex-direction: column; gap: 10px; transition: transform .12s, box-shadow .12s; position: relative; }
.pcard:hover { transform: translateY(-2px); box-shadow: 0 8px 26px rgba(60, 30, 40, .10); }
.pcard .ptype { font-size: 11.5px; font-weight: 700; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
.pcard h3 { margin: 0; font-size: 18px; line-height: 1.3; }
.pcard .where { color: var(--muted); font-size: 12.5px; }
.pcard .nums { display: flex; gap: 18px; font-size: 12px; color: var(--muted); }
.pcard .nums b { display: block; font: 700 24px/1 var(--num); color: var(--ink); }
.pcard .nums b.e { color: var(--emb); } .pcard .nums b.o { color: var(--op); }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
.strip i { height: 8px; border-radius: 1px; display: block; }
.pcard .foot { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 2px; }
.pcard .foot .faces { display: flex; }
.pcard .foot .faces span { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--surface); margin-left: -6px; display: grid; place-items: center; font-size: 10px; font-weight: 700; background: var(--panel); color: var(--ink); }
.pcard .foot .faces span:first-child { margin-left: 0; background: var(--accent-soft); color: var(--accent); }
.pcard .invite { position: absolute; top: 14px; right: 14px; border: 1px solid var(--hair); background: var(--surface); border-radius: 999px; font-size: 11.5px; font-weight: 700; padding: 3px 10px; }
.pcard.new { border: 1.5px dashed #CFC6C9; background: transparent; box-shadow: none; align-items: center; justify-content: center; color: var(--accent); font-weight: 700; min-height: 220px; }
.pcard.new .plus { width: 48px; height: 48px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; font-size: 26px; }
.tabs { display: flex; gap: 6px; }

/* ---------- workspace ---------- */
.work { display: grid; grid-template-columns: 250px minmax(0, 1fr) 400px; height: calc(100vh - 60px); }
.filters { border-right: 1px solid var(--hair); padding: 16px 14px; overflow: auto; background: var(--surface); }
.filters h2 { font-size: 16px; margin: 0 0 2px; }
.filters .sub { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
.filters h3 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; font-weight: 700; }
.fbtn { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 8px; border: 0; border-radius: 9px; background: none; font-size: 13px; text-align: left; }
.fbtn:hover { background: var(--panel); }
.fbtn.on { background: var(--panel); box-shadow: inset 0 0 0 1.5px var(--ink); font-weight: 700; }
.fbtn .n { margin-left: auto; color: var(--muted); font-size: 11.5px; font-weight: 500; }
.fbtn .prio { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #fff; font: 700 11px/20px var(--num); text-align: center; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--hair); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.range { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.range input { flex: 1; accent-color: var(--accent); }
.range b { font: 700 15px var(--num); width: 36px; text-align: right; }
.fcount { margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--hair); font-size: 13px; }
.fcount b { font: 700 24px var(--num); margin-right: 4px; }
.fclear { border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 12.5px; padding: 0; margin-top: 4px; }
.legend { margin-top: 18px; padding-top: 12px; border-top: 1px dashed var(--hair); font-size: 12px; color: var(--muted); }
.legend .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.legend .sw { width: 22px; height: 10px; border-radius: 1px; flex: none; }

.stage { position: relative; min-width: 0; display: flex; flex-direction: column; }
.stage-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px 0; font-size: 12.5px; color: var(--muted); }
.stage-head b { color: var(--ink); }
.stage > svg#viz { flex: 1 1 0; width: 100%; height: 0; min-height: 0; display: block; }
.stage svg .ring { transition: opacity .18s; }
.stage svg [data-tech], .stage svg [data-act] { cursor: pointer; }
#viz .stg:hover text, #viz .hdr:hover text, #viz .ring.sum:hover text { text-decoration: underline; }
.stage svg .ring > *, .stage svg .mod { transition: opacity .15s; }
#viz.hl .ring:not(.hot) > :not(.hot), #viz.hl .mod:not(.hot) { opacity: .1; }
.mx.focus tbody tr.t:not(.adopted):not(.considered) td { opacity: .32; }
.mx.focus tbody tr.t.considered td { opacity: .65; }

.panel { border-left: 1px solid var(--hair); background: var(--surface); overflow: auto; padding: 18px 20px 40px; }
.ptabs { display: flex; gap: 4px; margin-bottom: 14px; }
.ptabs button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.ptabs button.on { background: var(--panel); color: var(--ink); }
.panel h2 { font-size: 22px; line-height: 1.25; margin: 2px 0 2px; }
.panel h3 { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 18px 0 8px; }
.panel p { margin: 0 0 10px; }
.kick { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.kick .prio { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: #fff; font: 700 11px/18px var(--num); text-align: center; }
.alt { color: var(--muted); font-size: 12.5px; }
.statusbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 14px 0 4px; }
.statusbar button { border: 1.5px solid var(--hair); background: var(--surface); border-radius: 12px; padding: 8px 4px; font-size: 12.5px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.statusbar button .ic { font-size: 15px; line-height: 1; }
.statusbar button.on.adopted { background: var(--accent); border-color: var(--accent); color: #fff; }
.statusbar button.on.considered { border-color: var(--ink); background: var(--panel); }
.statusbar button.on.rejected { border-color: var(--muted); background: var(--panel); color: var(--muted); }
.hint { color: var(--muted); font-size: 12px; }
.sav { display: grid; grid-template-columns: 96px 1fr 52px; align-items: center; gap: 10px; margin: 8px 0; font-size: 12.5px; font-weight: 700; }
.sav .bar { height: 10px; border-radius: 6px; background: var(--panel); overflow: hidden; }
.sav .bar i { display: block; height: 100%; border-radius: 6px; }
.sav b { font: 700 22px var(--num); text-align: right; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kv > div { background: var(--panel); border-radius: 12px; padding: 10px 12px; }
.kv .k { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
.kv .v { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.res { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; color: #fff; font: 700 12px var(--num); }
.res.H { background: #1E7F4F; } .res.M { background: #E0A100; color: var(--ink); } .res.L { background: #1E1E28; }
.yen { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 4px; padding: 0 4px; font: 700 13px var(--num); }
.yen s { text-decoration: none; color: #C4C4CC; }
.mods { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.mods div { font-size: 11px; line-height: 1.2; color: var(--muted); }
.mods div i { display: block; height: 26px; border-radius: 6px; margin-bottom: 5px; }
.mods div b { display: block; font: 700 12.5px var(--num); letter-spacing: .02em; color: var(--sc); }
.big2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.big2 > div { border-radius: 14px; padding: 12px 14px; background: var(--panel); }
.big2 .k { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.big2 .v { font: 700 44px/1 var(--num); margin-top: 4px; }
.big2 .v small { font-size: 22px; }
.big2 .e .k, .big2 .e .v { color: var(--emb); } .big2 .o .k, .big2 .o .v { color: var(--op); }
.note { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.counts { display: flex; gap: 6px; margin-top: 6px; }
.counts span { flex: 1; text-align: center; background: var(--panel); border-radius: 10px; padding: 6px 4px; font-size: 11.5px; color: var(--muted); }
.counts b { display: block; font: 700 20px var(--num); color: var(--ink); }
.scopes .row { display: grid; grid-template-columns: 110px 1fr 46px; gap: 10px; align-items: center; margin: 7px 0; font-size: 12.5px; font-weight: 700; }
.scopes .meter { height: 12px; border-radius: 6px; background: var(--panel); overflow: hidden; display: flex; }
.scopes .meter i { display: block; height: 100%; }
.scopes .pct { font: 700 16px var(--num); text-align: right; }
.dist { display: flex; gap: 6px; align-items: center; font-size: 12.5px; }
.list { list-style: none; padding: 0; margin: 0; }
.list li { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--hair); font-size: 13px; }
.list li:last-child { border-bottom: 0; }
.list li button { all: unset; cursor: pointer; flex: 1; }
.list li button:hover { text-decoration: underline; }
.list .tag { font-size: 11px; color: var(--muted); }

/* ---------- tooltip ---------- */
.tip { position: fixed; z-index: 60; pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 9px 12px; max-width: 280px; font-size: 12.5px; box-shadow: 0 6px 22px rgba(60, 30, 40, .14); }
.tip.on { opacity: 1; transform: none; }
.tip strong { display: block; font-size: 13.5px; }
.tip .do { color: var(--accent); font-weight: 700; display: block; margin-top: 4px; font-size: 11.5px; }

/* ---------- full sheet ---------- */
.overlay { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 18px; background: rgba(46, 24, 33, .45); backdrop-filter: blur(3px); }
.overlay[hidden] { display: none; }
.sheet { width: min(1120px, 100%); max-height: calc(100vh - 36px); overflow: auto; background: var(--surface); border-radius: 18px; box-shadow: 0 24px 70px rgba(30, 10, 18, .35); animation: pop .2s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
.s-head { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: 8px 1fr auto; gap: 16px; align-items: center; padding: 18px 22px 14px; background: var(--surface); border-bottom: 1px solid var(--hair); }
.s-bar { align-self: stretch; border-radius: 4px; background: var(--accent); }
.s-head h2 { font-size: 28px; margin: 2px 0 0; line-height: 1.2; }
.s-nav { display: flex; gap: 6px; }
.s-body { display: grid; grid-template-columns: 1.1fr .9fr; gap: 22px 30px; padding: 20px 26px 8px; }
.s-body h3 { font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
.s-box { border-radius: 14px; padding: 12px 16px; background: var(--panel); }
.s-row { display: grid; grid-template-columns: 130px 1fr; gap: 8px; font-size: 13px; padding: 7px 0; border-bottom: 1px dashed var(--hair); align-items: center; }
.s-row:last-child { border-bottom: 0; }
.s-row > span:first-child { font-weight: 700; }
.steps { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 8px; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; font-size: 13.5px; }
.steps .num { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font: 700 13px var(--num); }
.s-cases { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; padding: 10px 26px 26px; }
.s-case { border: 1px solid var(--hair); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
.s-case .ph { height: 120px; background: repeating-linear-gradient(135deg, #EFE9EB 0 10px, #F6F2F3 10px 20px); display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.s-case header { padding: 10px 14px; background: var(--ink); color: #fff; }
.s-case header strong { display: block; font-size: 15px; }
.s-case header span { font-size: 12px; opacity: .85; }
.s-case section { padding: 10px 14px 4px; font-size: 13px; }
.s-case h4 { margin: 0 0 4px; font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
.s-case ul { margin: 0 0 8px; padding-left: 16px; }
.s-case .src { margin-top: auto; padding: 6px 14px 10px; font-size: 11px; color: var(--muted); }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: rgba(46, 24, 33, .45); }
.modal[hidden] { display: none; }
.mbox { width: min(560px, 94vw); background: var(--surface); border-radius: 18px; padding: 22px 24px; box-shadow: 0 24px 70px rgba(30, 10, 18, .35); animation: pop .2s ease-out; }
.mbox h2 { margin: 0 0 4px; font-size: 22px; }
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 14px 0; }
.mgrid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--muted); }
.mgrid label.full { grid-column: 1 / -1; }
.mgrid input, .mgrid select { font: inherit; font-weight: 400; color: var(--ink); border: 1px solid var(--hair); border-radius: 10px; padding: 8px 10px; background: var(--surface); }
.mact { display: flex; justify-content: flex-end; gap: 8px; }
.members { list-style: none; margin: 12px 0; padding: 0; }
.members li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--hair); font-size: 13px; }
.members li .who { flex: 1; } .members li .who small { display: block; color: var(--muted); font-size: 11.5px; }
.members select { font: inherit; font-size: 12px; border: 1px solid var(--hair); border-radius: 8px; padding: 3px 6px; }
.inv { display: flex; gap: 8px; } .inv input { flex: 1; font: inherit; border: 1px solid var(--hair); border-radius: 999px; padding: 8px 14px; }
.toast { position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); z-index: 95; background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 80vw; }
.toast.on { opacity: 1; }
@media (max-width: 1300px) { .work { grid-template-columns: 220px minmax(0, 1fr) 340px; } }

/* ---------- v2: readability ---------- */
.work.nofilters { grid-template-columns: minmax(0, 1fr) 420px; }
.work.nofilters .filters { display: none; }
.work.present { grid-template-columns: minmax(0, 1fr); }
.work.present .filters, .work.present .panel { display: none; }
.filters h2 { font-size: 18px; } .filters .sub, .legend { font-size: 13px; }
.fbtn { font-size: 14px; padding: 7px 8px; } .chip { font-size: 13px; padding: 5px 11px; }
.panel { font-size: 15px; } .panel h2 { font-size: 26px; } .panel h3 { font-size: 13px; }
.stage-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--hair); background: var(--surface); flex-wrap: wrap; }
.stage-bar .seg button { font-size: 13.5px; padding: 6px 16px; }
.zoom { display: inline-flex; gap: 4px; align-items: center; }
.zoom button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--hair); background: var(--surface); font-weight: 700; font-size: 17px; line-height: 1; }
.zoom button.wide { width: auto; padding: 0 14px; border-radius: 999px; font-size: 13px; }
.zoom span { font: 700 15px var(--num); min-width: 46px; text-align: center; color: var(--muted); }
.stage-note { font-size: 12.5px; color: var(--muted); }
.stage svg.zoomable { cursor: grab; } .stage svg.zoomable.panning { cursor: grabbing; }

/* matrix view */
.mx-wrap { flex: 1 1 0; overflow: auto; min-height: 0; }
.mx { border-collapse: separate; border-spacing: 0; min-width: 100%; font-size: 14px; }
.mx th, .mx td { padding: 0; }
.mx thead th { position: sticky; background: var(--surface); z-index: 3; font-weight: 700; color: var(--muted); }
.mx thead tr.g th { top: 0; height: 34px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; text-align: center; border-bottom: 2px solid var(--hair); }
.mx thead tr.g th.grph { color: var(--sc); border-bottom: 3px solid var(--sc); cursor: pointer; white-space: nowrap; padding: 0 8px; }
.mx thead tr.g th .tog { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid currentColor; margin-left: 8px; font-size: 13px; line-height: 1; }
.mx thead tr.m th.mod b { font-size: 13px; }
.mx thead tr.m th.mod small { max-width: 58px; font-size: 9.5px; hyphens: auto; }
.mx td.cell.mod { width: 60px; min-width: 60px; } .mx td.cell.mod i { width: 44px; }
.subs-h { font-size: 11.5px; color: var(--muted); margin: 12px 0 6px; }
.subs { display: flex; flex-wrap: wrap; gap: 8px; }
.sg { display: flex; gap: 2px; padding-top: 4px; border-top: 2px solid var(--sc); }

function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 3800); }

/* ---------- project score ---------- */
function score(p, cs = cols()) {
  const st = p.status, ad = TECHS.filter((x) => st[x.id] === 'adopted');
  const comb = (k) => Math.round((1 - ad.reduce((m, x) => m * (1 - x[k] / 100), 1)) * 100);
  const best = cs.map((c) => LVK[ad.reduce((b, x) => Math.max(b, LV[lvOf(x, c)]), 0)]);
  const cnt = (s) => TECHS.filter((x) => st[x.id] === s).length;
  const dist = (k) => ({ H: ad.filter((x) => x[k] === 'H').length, M: ad.filter((x) => x[k] === 'M').length, L: ad.filter((x) => x[k] === 'L').length });
  return { ad, emb: comb('emb'), op: comb('op'), best, adopted: cnt('adopted'), considered: cnt('considered'), rejected: cnt('rejected'), cost: dist('cost'), res: dist('res') };
}

/* ---------- filters ---------- */
function filterOn() { const f = S.f; return f.cats.size || f.stages.size || f.status.size || f.cost.size || f.res.size || f.minEmb || f.minOp; }
function matches(x) {
  const f = S.f, p = proj(), st = (p && p.status[x.id]) || 'none';
  if (f.cats.size && !f.cats.has(x.cat)) return false;
  if (f.stages.size && !stageCols().some((c) => f.stages.has(c.k) && lvOf(x, c) !== 'N')) return false;
  if (f.status.size && !f.status.has(st)) return false;
  if (f.cost.size && !f.cost.has(x.cost)) return false;
  if (f.res.size && !f.res.has(x.res)) return false;
  if (x.emb < f.minEmb || x.op < f.minOp) return false;
  return true;
}

const NODE_R = R_IN + RING_BUDGET + 52, GRP_R = NODE_R + 74;

const P = (R, a) => { const r = a * Math.PI / 180; return [C + R * Math.sin(r), C - R * Math.cos(r)]; };

const FONT = "'Barlow Condensed', 'Zen Kaku Gothic New', 'Arial Narrow', sans-serif";
function textW(s, fs, ls = 0) { let w = 0; for (const ch of String(s)) { const c = ch.codePointAt(0); w += (c >= 0x2E80 ? 1 : ch === ' ' ? 0.25 : /[A-Z0-9%¥]/.test(ch) ? 0.52 : 0.45) * fs + ls; } return w; }
function wrap(s, maxW, fs) {
  const sp = /\s/.test(s), parts = sp ? s.split(/\s+/) : s.split(/(?<=[・·])/), lines = []; let cur = '';
  for (const p of parts) { const cand = cur ? cur + (sp ? ' ' : '') + p : p; if (cur && textW(cand, fs) > maxW) { lines.push(cur); cur = p; } else cur = cand; }
  if (cur) lines.push(cur);
  return lines;
}

// radial layout: a closed category is one thick summary ring; opening it gives each technology its own ring
function radGeo(ex) {
  const inner = [...CATS].sort((a, b) => b.prio - a.prio);
  const groups = inner.map((cat) => { const techs = TECHS.filter((x) => x.cat === cat.id), e = ex[cat.id] || 0; return { cat, techs, e, w: WC + (techs.length - WC) * e }; });
  const unit = Math.min(UNIT_MAX, (RING_BUDGET - groups.length * GAP_H) / groups.reduce((a, g) => a + g.w, 0));
  let r = R_IN;
  groups.forEach((g) => {
    const T = g.w * unit, n = g.techs.length;
    Object.assign(g, { in: r, T, sumR: r + T / 2, sumW: Math.min(44, T * 0.72), step: T / n, head: r + T + GAP_H / 2, out: r + T + GAP_H });
    g.segW = Math.min(18, g.step * 0.72); g.nameF = Math.min(17, g.step * 0.72); g.barW = Math.min(9, g.step * 0.42);
    g.rings = g.techs.map((x, k) => ({ x, R: r + (k + 0.5) * g.step }));
    r = g.out;
  });
  return { groups, R_OUT: groups[groups.length - 1].in + groups[groups.length - 1].T };
}

      const mp = (R) => (mflip ? arcRev(R, ss.a0, ss.a1) : arc(R, ss.a0, ss.a1));

// shrink a label only when it is longer than its arc (long names on small rings, long module names)
function fitNames() {
  const svg = document.getElementById('viz');
  if (!svg) return;
  svg.querySelectorAll('text[data-fit]').forEach((el) => {
    const path = svg.querySelector(el.dataset.fit), fs = parseFloat(el.getAttribute('font-size')), avail = path.getTotalLength() - 6;
    el.style.fontSize = '';
    const len = el.getComputedTextLength();
    if (len > avail) el.style.fontSize = (fs * avail / len).toFixed(2) + 'px';
  });
}
// open / close with a short animation of the wheel; everything else re-renders once
let exRaf = 0;
function animateOpen() {
  const to = targetEx(), from = { ...S.ex };
  cancelAnimationFrame(exRaf);
  render();
  if (S.screen !== 'work' || S.mode !== 'wheel' || !document.getElementById('viz')) { S.ex = to; render(); return; }
  const t0 = performance.now(), dur = 450;
  const step = (now) => {
    const k = Math.min(1, (now - t0) / dur), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    if (k < 1) {
      OPEN_KEYS.forEach((key) => { S.ex[key] = from[key] + (to[key] - from[key]) * e; });
      const svg = document.getElementById('viz');
      if (svg) { svg.outerHTML = chartSvg(); applyZoom(); }
      exRaf = requestAnimationFrame(step);
    } else { S.ex = to; render(); }
  };
  exRaf = requestAnimationFrame(step);
}
function toggleOpen(k) { if (S.open.has(k)) S.open.delete(k); else S.open.add(k); animateOpen(); }

    <thead><tr class="g"><th class="st"></th><th class="name"></th>${groupRow}<th colspan="3"></th></tr>
      <tr class="m"><th class="st"></th><th class="name">${esc(t('tabTech'))}</th>${colRow}
        <th style="text-align:left;padding-left:14px">${esc(t('embodied'))} / ${esc(t('operational'))}</th><th>${esc(t('resShort'))}</th><th>${esc(t('cost'))}</th></tr></thead>
    <tbody>${rows.join('')}</tbody>
    <tfoot><tr><td class="st"></td><td class="name"><b>${esc(t('projectRow'))}</b><small>${sc.adopted} ${esc(t('centreHint'))}</small></td>${cs.map((c, j) => `<td class="cell${c.isStage ? '' : ' mod'}${first.has(j) ? ' gap' : ''}"><i style="background:${IMPC[sc.best[j]]}"></i></td>`).join('')}
      <td class="sav"><div class="ln"><span style="color:#D7262B">−${sc.emb}%</span><b></b></div><div class="ln"><span style="color:#4E5070">−${sc.op}%</span><b></b></div></td><td></td><td></td></tr></tfoot>
  </table>${hidden ? `<div class="mx-hidden">${esc(t('hiddenN', hidden))}</div>` : ''}</div>`;
}

function workHtml() {
  const cls = S.present ? ' present' : S.showFilters ? '' : ' nofilters';
  return topBar() + `<div class="work${cls}">${filtersHtml()}<section class="stage" id="stage">${stageBar()}${S.mode === 'wheel' ? chartSvg() : matrixHtml()}</section>${panelHtml()}</div>`;
}

/* ---------- wheel zoom and pan ---------- */
const VB = { x: 175, y: 205, w: 1650, h: 1665 };
function applyZoom() {
  const svg = document.getElementById('viz');
  if (!svg) return;
  const z = S.zoom, w = VB.w / z.k, h = VB.h / z.k;
  z.cx = Math.max(VB.x + w / 2, Math.min(VB.x + VB.w - w / 2, z.cx));
  z.cy = Math.max(VB.y + h / 2, Math.min(VB.y + VB.h - h / 2, z.cy));
  svg.setAttribute('viewBox', `${(z.cx - w / 2).toFixed(1)} ${(z.cy - h / 2).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
  svg.classList.add('zoomable');
  const lab = document.querySelector('.zoom span');
  if (lab) lab.textContent = Math.round(z.k * 100) + '%';
}
function zoomBy(f, px, py) {
  const z = S.zoom, k2 = Math.max(1, Math.min(6, z.k * f));
  if (px != null) { z.cx = px + (z.cx - px) * (z.k / k2); z.cy = py + (z.cy - py) * (z.k / k2); }
  z.k = k2; applyZoom();
}
function svgPoint(svg, e) { const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal, s = Math.max(vb.width / r.width, vb.height / r.height); return { x: vb.x + (e.clientX - r.left - (r.width - vb.width / s) / 2) * s, y: vb.y + (e.clientY - r.top - (r.height - vb.height / s) / 2) * s, s }; }

function sheetHtml(x) {
  const c = catOf(x), list = TECHS.filter(matches), i = list.findIndex((y) => y.id === x.id);
  const prev = list[(i - 1 + list.length) % list.length], next = list[(i + 1) % list.length];
  const caseCard = (n) => `<article class="s-case"><div class="ph">photo</div><header><strong>${esc(t('caseSample'))} ${n}</strong><span>${esc(S.lang === 'ja' ? '所在地 · 年' : 'Location · year')}</span></header>
    <section><h4>${esc(t('did'))}</h4><ul><li>${esc(S.lang === 'ja' ? '取り組み内容の例' : 'Example of what was done')}</li></ul><h4>${esc(t('results'))}</h4><ul><li>${esc(S.lang === 'ja' ? '定量的な成果の例' : 'Example of a measured result')}</li></ul><h4>${esc(t('challenges'))}</h4><ul><li>${esc(S.lang === 'ja' ? '課題の例' : 'Example of a challenge')}</li></ul></section>
    <div class="src">${esc(t('caseNote'))}</div></article>`;
  return `<div class="s-head"><div class="s-bar"></div><div><div class="kick"><span class="prio">${c.prio}</span>${esc(tn(c))}</div><h2>${esc(tn(x))}</h2><div class="alt">${esc(S.lang === 'ja' ? x.en : x.ja)}</div></div>
      <div class="s-nav"><button class="btn" data-sheet="${prev.id}">${esc(t('prev'))}</button><button class="btn" data-sheet="${next.id}">${esc(t('next'))}</button><button class="btn" data-act="closeSheet">${esc(t('close'))}</button></div></div>
    <div class="s-body"><div><h3>${esc(t('summary'))}</h3><p style="font-size:16px;font-weight:700">${esc(S.lang === 'ja' ? x.sumJa : x.sumEn)}</p>
      <h3 style="margin-top:16px">${esc(t('how'))}</h3>
      <ol class="steps"><li><span class="num">1</span><span>${esc(S.lang === 'ja' ? '手順や仕組みの説明（管理者が記入）' : 'Step or mechanism (written by administrators)')}</span></li><li><span class="num">2</span><span>${esc(S.lang === 'ja' ? '手順や仕組みの説明' : 'Step or mechanism')}</span></li><li><span class="num">3</span><span>${esc(S.lang === 'ja' ? '手順や仕組みの説明' : 'Step or mechanism')}</span></li></ol></div>
      <div><h3>${esc(t('keyFacts'))}</h3><div class="s-box">
        <div class="s-row"><span>${esc(t('embodied'))}</span><span style="font:700 20px var(--num);color:#D7262B">${x.emb}%</span></div>
        <div class="s-row"><span>${esc(t('operational'))}</span><span style="font:700 20px var(--num);color:#4E5070">${x.op}%</span></div>
        <div class="s-row"><span>${esc(t('resilience'))}</span><span><span class="res ${x.res}">${x.res}</span> ${esc(rcName(x.res))}</span></div>
        <div class="s-row"><span>${esc(t('cost'))}</span><span>${yen(x.cost)} ${esc(rcName(x.cost))}</span></div>
        <div class="s-row" style="display:block"><span>${esc(S.audience === 'client' ? t('scopes') : t('modules'))}</span><div style="margin-top:8px">${modsHtml(x)}</div></div></div></div></div>
    <div style="padding:0 26px"><h3 style="font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:8px 0 0">${esc(t('cases'))}</h3></div>
    <div class="s-cases">${caseCard(1)}${caseCard(2)}</div>`;
}

/* =====================================================================================================
   RENDER + EVENTS
   ===================================================================================================== */
const app = document.getElementById('app');
function render() {
  document.documentElement.lang = S.lang;
  app.innerHTML = S.screen === 'picker' ? pickerHtml() : workHtml();
  hotKey = '';
  fitNames();
  const q = document.getElementById('q');
  if (q) q.addEventListener('input', () => { S.q = q.value; const pos = q.selectionStart; render(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); });
  document.querySelectorAll('input[type=range]').forEach((r) => r.addEventListener('input', () => { S.f[r.dataset.r] = Number(r.value); render(); }));
  const svg = document.getElementById('viz');
  if (svg) {
    applyZoom();
    svg.addEventListener('wheel', (e) => { e.preventDefault(); const p = svgPoint(svg, e); zoomBy(e.deltaY < 0 ? 1.18 : 1 / 1.18, p.x, p.y); }, { passive: false });
    svg.addEventListener('pointerdown', (e) => {
      if (S.zoom.k <= 1 || e.button !== 0) return;
      const start = svgPoint(svg, e), cx0 = S.zoom.cx, cy0 = S.zoom.cy, x0 = e.clientX, y0 = e.clientY;
      let moved = false;
      const move = (ev) => {
        if (!moved && Math.abs(ev.clientX - x0) + Math.abs(ev.clientY - y0) < 5) return;
        moved = true; svg.classList.add('panning');
        S.zoom.cx = cx0 - (ev.clientX - x0) * start.s; S.zoom.cy = cy0 - (ev.clientY - y0) * start.s; applyZoom();
      };
      const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); svg.classList.remove('panning'); if (moved) { suppressClick = true; setTimeout(() => { suppressClick = false; }, 60); } };
      addEventListener('pointermove', move); addEventListener('pointerup', up);
    });
  }
}
let suppressClick = false;
function openProject(id) { S.projectId = id; S.screen = 'work'; S.sel = null; S.ptab = 'score'; render(); }
function select(id) { S.sel = id; S.ptab = 'tech'; const cat = TECH[id].cat; if (!S.open.has(cat)) { S.open.add(cat); S.ex[cat] = 1; } if (S.present) { openSheet(id); return; } render(); }
function openSheet(id) { S.sel = id; const o = document.getElementById('overlay'); document.getElementById('sheet').innerHTML = sheetHtml(TECH[id]); o.hidden = false; }

app.addEventListener('click', (e) => {
  if (suppressClick) return;
  const b = e.target.closest('button, [data-open], [data-act], [data-tech], [data-row]');
  if (!b) return;
  if (b.dataset.z) { if (b.dataset.z === 'fit') { S.zoom = { k: 1, cx: 1000, cy: 1000 }; applyZoom(); } else zoomBy(b.dataset.z === 'in' ? 1.4 : 1 / 1.4); return; }
  if (b.dataset.mstatus) { const p = proj(), id = b.dataset.mstatus; p.status[id] === b.dataset.v ? delete p.status[id] : (p.status[id] = b.dataset.v); S.sel = id; S.ptab = 'tech'; render(); return; }
  if (b.dataset.row) { select(b.dataset.row); return; }
  const seg = b.closest('.seg');
  if (seg && b.dataset.v) {
    const g = seg.dataset.g;
    if (g === 'view') { if (b.dataset.v === 'admin') toast(t('adminToast')); return; }
    if (g === 'audience') S.f.stages.clear();
    S[g] = b.dataset.v; render(); return;
  }
  if (b.dataset.invite) { e.stopPropagation(); inviteModal(PROJECTS.find((p) => p.id === b.dataset.invite)); return; }
  if (b.dataset.open) { openProject(b.dataset.open); return; }
  const act = b.dataset.act;
  if (act === 'cat' || act === 'stage') { toggleOpen(b.dataset.k); return; }
  if (act === 'openAll') { OPEN_KEYS.forEach((k) => S.open.add(k)); animateOpen(); return; }
  if (act === 'closeAll') { S.open.clear(); animateOpen(); return; }
  if (act === 'home') { S.screen = 'picker'; render(); return; }
  if (act === 'new') { newModal(); return; }
  if (act === 'invite') { inviteModal(proj()); return; }
  if (act === 'pdf') { toast(t('pdfToast')); return; }
  if (act === 'toggleFilters') { S.showFilters = !S.showFilters; render(); return; }
  if (act === 'present') { S.present = !S.present; if (S.present) S.mode = 'wheel'; render(); return; }
  if (act === 'clear') { S.f = { cats: new Set(), stages: new Set(), status: new Set(), cost: new Set(), res: new Set(), minEmb: 0, minOp: 0 }; render(); return; }
  if (act === 'sheet') { openSheet(S.sel); return; }
  if (b.dataset.f) { const s = S.f[b.dataset.f]; s.has(b.dataset.v) ? s.delete(b.dataset.v) : s.add(b.dataset.v); render(); return; }
  if (b.dataset.ptab) { if (b.dataset.ptab === 'tech' && !S.sel) return; S.ptab = b.dataset.ptab; render(); return; }
  if (b.dataset.sel) { select(b.dataset.sel); return; }
  if (b.dataset.status) { const p = proj(); p.status[S.sel] === b.dataset.status ? delete p.status[S.sel] : (p.status[S.sel] = b.dataset.status); render(); return; }
  if (b.dataset.tech) { select(b.dataset.tech); }
});
app.addEventListener('dblclick', (e) => { const g = e.target.closest('[data-tech]'); if (g) openSheet(g.dataset.tech); });

// tooltip
const tip = document.getElementById('tip');
// hover tracing: a segment lights its ring and its module column, a module node its column, a name or bar its ring
let hotKey = '';
function trace(e) {
  const svg = document.getElementById('viz');
  if (!svg) return;
  const cEl = e && e.target.closest ? e.target.closest('#viz [data-c]') : null, rEl = e && e.target.closest ? e.target.closest('#viz [data-tech]') : null;
  const c = cEl ? cEl.getAttribute('data-c') : null, r = rEl ? rEl.getAttribute('data-tech') : null, key = (r || '') + '|' + (c ?? '');
  if (key === hotKey) return;
  hotKey = key;
  svg.querySelectorAll('.hot').forEach((n) => n.classList.remove('hot'));
  if (!r && c == null) { svg.classList.remove('hl'); return; }
  if (r) svg.querySelector(`.ring[data-tech="${r}"]`).classList.add('hot');
  if (c != null) svg.querySelectorAll(`[data-c="${c}"]`).forEach((n) => n.classList.add('hot'));
  svg.classList.add('hl');
}
app.addEventListener('mousemove', (e) => {
  trace(e);
  const el = e.target.closest('[data-tip]');
  if (!el || !el.closest('svg')) { tip.classList.remove('on'); return; }
  const [a, b] = el.getAttribute('data-tip').split('|');
  tip.innerHTML = `<strong>${esc(a)}</strong>${esc(b || '')}${el.closest('[data-tech]') ? `<span class="do">${esc(t('clickOpen'))}</span>` : ''}`;
  const w = 290, x = Math.min(e.clientX + 16, innerWidth - w), y = Math.min(e.clientY + 16, innerHeight - 90);
  tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.classList.add('on');
});
app.addEventListener('mouseleave', () => { tip.classList.remove('on'); trace(null); });

// sheet
const overlay = document.getElementById('overlay');
overlay.addEventListener('click', (e) => {
  if (e.target === overlay || e.target.closest('[data-act="closeSheet"]')) { overlay.hidden = true; render(); return; }
  const n = e.target.closest('[data-sheet]');
  if (n) openSheet(n.dataset.sheet);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { overlay.hidden = true; document.getElementById('modal').hidden = true; } });

// modals
const modal = document.getElementById('modal'), mbox = document.getElementById('mbox');
function closeModal() { modal.hidden = true; }
modal.addEventListener('click', (e) => { if (e.target === modal || e.target.closest('[data-m="cancel"]')) closeModal(); });
function newModal() {
  const opt = (o) => Object.entries(o).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('');
  mbox.innerHTML = `<h2>${esc(t('newTitle'))}</h2>
    <div class="mgrid"><label class="full">${esc(t('pName'))}<input id="nName" value="${S.lang === 'ja' ? '新しいプロジェクト' : 'New project'}"></label>
      <label>${esc(t('pType'))}<select>${opt(BTYPE[S.lang])}</select></label>
      <label>${esc(t('pWork'))}<select><option>${esc(t('workNew'))}</option><option>${esc(t('workRetro'))}</option><option>${esc(t('workReuse'))}</option></select></label>
      <label>${esc(t('pStage'))}<select>${opt(PSTAGE[S.lang])}</select></label>
      <label>${esc(t('pAddr'))}<input placeholder="${S.lang === 'ja' ? '例：大阪市中央区' : 'e.g. Chuo-ku, Osaka'}"></label>
      <label class="full">${esc(t('pInvite'))}<input placeholder="${esc(t('email'))}, …"></label></div>
    <div class="mact"><button class="btn ghost" data-m="cancel">${esc(t('cancel'))}</button><button class="btn primary" data-m="create">${esc(t('create'))}</button></div>`;
  modal.hidden = false;
  mbox.querySelector('[data-m="create"]').onclick = () => {
    const name = document.getElementById('nName').value || 'New project';
    const id = 'p' + (PROJECTS.length + 1);
    PROJECTS.unshift({ id, name, nameJa: name, type: 'office', stage: 'planning', place: '—', placeJa: '—', mine: true, members: [[ME.short, ME.name, 'owner']], status: {} });
    closeModal(); openProject(id);
  };
}
function inviteModal(p) {
  const roleSel = (r) => r === 'owner' ? `<b style="font-size:12px">${esc(t('owner'))}</b>` : `<select><option${r === 'view' ? ' selected' : ''}>${esc(t('canView'))}</option><option${r === 'edit' ? ' selected' : ''}>${esc(t('canEdit'))}</option></select>`;
  const draw = () => {
    mbox.innerHTML = `<h2>${esc(t('inviteTitle', S.lang === 'ja' ? p.nameJa : p.name))}</h2><p class="hint">${esc(t('inviteSub'))}</p>
      <div class="inv"><input id="invEmail" placeholder="${esc(t('email'))}"><button class="btn primary" data-m="send">${esc(t('send'))}</button></div>
      <ul class="members">${p.members.map((m) => `<li><span class="avatar">${m[0]}</span><span class="who">${esc(m[1])}<small>${esc(m[1].toLowerCase().replace(' ', '.'))}@takenaka.co.jp</small></span>${roleSel(m[2])}</li>`).join('')}</ul>
      <div class="mact"><button class="btn" data-m="cancel">${esc(t('close'))}</button></div>`;
    mbox.querySelector('[data-m="send"]').onclick = () => {
      const v = document.getElementById('invEmail').value.trim();
      if (!v) return;
      const nm = v.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
      p.members.push([nm.split(' ').map((w) => w[0]).join('').slice(0, 2).toUpperCase(), nm, 'view']);
      toast(t('invited')); draw();
    };
  };
  draw(); modal.hidden = false;
}

// deep links for review: #p=p1&sel=MASS_TIMBER&aud=client&lang=ja&sheet=MASS_TIMBER&f=BUILD_LIGHTER
(function boot() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('lang')) S.lang = h.get('lang');
  if (h.get('aud')) S.audience = h.get('aud');
  if (h.get('p')) { S.projectId = h.get('p'); S.screen = 'work'; }
  if (h.get('sel')) { S.sel = h.get('sel'); S.ptab = 'tech'; }
  if (h.get('mode')) S.mode = h.get('mode');
  if (h.get('open')) { h.get('open').split(',').forEach((k) => (k === 'all' ? OPEN_KEYS.forEach((x) => S.open.add(x)) : S.open.add(k))); S.ex = targetEx(); }
  if (h.get('focus')) S.focus = h.get('focus');
  if (h.get('zoom')) { const [k, cx, cy] = h.get('zoom').split(',').map(Number); S.zoom = { k, cx, cy }; }
  if (h.get('nofilters')) S.showFilters = false;
  if (h.get('present')) { S.present = true; S.mode = 'wheel'; }
  if (h.get('f')) h.get('f').split(',').forEach((c) => S.f.cats.add(c));
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitNames);
  if (h.get('sheet')) openSheet(h.get('sheet'));
})();
</script>
